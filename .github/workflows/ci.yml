name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: caste
          POSTGRES_PASSWORD: caste
          POSTGRES_DB: caste_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caste"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://caste:caste@localhost:5432/caste_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @caste/api db:push
      - run: pnpm -r test
      - run: pnpm --filter @caste/web build
